defaults:
  provider: ollama
  model_family: qwen
  automatic_install: true
  hardware_profile: auto

preferred_existing_models:
  - bunker-agent-qwen
  - qwen3.5-hermes-128k
  - qwen3.5-hermes-262k
  - edtorre/qwen3.5-hermes:latest

hardware_profiles:
  tiny:
    max_memory_gb: 10
    install_model: qwen3:4b
    context_length: 16384
    max_parallel_agents: 1

  small:
    max_memory_gb: 18
    install_model: qwen3:8b
    context_length: 24576
    max_parallel_agents: 1

  medium:
    max_memory_gb: 28
    install_model: qwen3:8b
    context_length: 32768
    max_parallel_agents: 2

  large:
    max_memory_gb: 52
    install_model: qwen3:14b
    context_length: 32768
    max_parallel_agents: 2

  huge:
    max_memory_gb: 9999
    install_model: qwen3:14b
    context_length: 49152
    max_parallel_agents: 3
